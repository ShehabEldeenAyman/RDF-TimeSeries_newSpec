competency questions:
  Semantic discovery:
  - id: CQ1
    question: Which sources describe a specified observed property for a specified feature of interest?
    example: Find conductivity series for Water Body A.
    query: |
      PREFIX tss: <https://w3id.org/tss#>
      PREFIX ex: <https://example.org/rdftss-cq/>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT DISTINCT ?source ?field WHERE {
          ?source tss:hasField ?field .
          ?field tss:observedProperty ex:ElectricalConductivity ;
                 tss:featureOfInterest ex:WaterBodyA .
      } ORDER BY ?source ?field
    interpretation: Exact domain IRI matching; no inference or vocabulary alignment is performed. Matching metadata does not establish payload availability.
  - id: CQ2
    question: Which relevant sources have declared temporal windows overlapping a requested interval?
    example: Find conductivity series for Water Body A overlapping [2026-01-01T00:00:00Z, 2026-01-02T00:00:00Z).
    query: |
      PREFIX tss: <https://w3id.org/tss#>
      PREFIX ex: <https://example.org/rdftss-cq/>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT DISTINCT ?source ?from ?until WHERE {
          ?source tss:hasField ?field .
          ?field tss:observedProperty ex:ElectricalConductivity ;
                 tss:featureOfInterest ex:WaterBodyA .
          OPTIONAL { ?source tss:from ?from }
          OPTIONAL { ?source tss:until ?until }
          FILTER (!BOUND(?from) || xsd:dateTime(STR(?from)) < "2026-01-02T00:00:00Z"^^xsd:dateTime)
          FILTER (!BOUND(?until) || xsd:dateTime(STR(?until)) > "2026-01-01T00:00:00Z"^^xsd:dateTime)
      } ORDER BY ?source
    interpretation: Absent bounds are open. Assumes conforming timestamps and nonempty declared windows. Boundary-touching windows do not overlap. A matching window does not guarantee readings exist in it.
  Source access:
  - id: CQ3
    question: Where are the readings of relevant sources located, and how are they represented?
    example: Locate external CSV, Parquet and Arrow references or embedded access predicates for conductivity series concerning Water Body A.
    query: |
      PREFIX tss: <https://w3id.org/tss#>
      PREFIX ex: <https://example.org/rdftss-cq/>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT DISTINCT ?source ?profile ?dataFile ?accessPredicate WHERE {
          ?source tss:hasField ?field .
          ?field tss:observedProperty ex:ElectricalConductivity ;
                 tss:featureOfInterest ex:WaterBodyA .
          VALUES ?profile { tss:CSVSource tss:ParquetSource tss:ArrowSource tss:EmbeddedJSONSource tss:EmbeddedRDFSource }
          ?source a ?profile .
          {
              VALUES ?profile { tss:CSVSource tss:ParquetSource tss:ArrowSource }
              ?source tss:dataFile ?dataFile .
              BIND(tss:dataFile AS ?accessPredicate)
          } UNION {
              VALUES ?profile { tss:EmbeddedJSONSource }
              BIND(tss:points AS ?accessPredicate)
          } UNION {
              VALUES ?profile { tss:EmbeddedRDFSource }
              BIND(tss:hasPoint AS ?accessPredicate)
          }
      } ORDER BY ?source
    interpretation: Embedded results identify the source and predicate in the queried catalog, not a new file URL. No JSON literals or point readings are selected. External URLs are not dereferenced.
  - id: CQ4
    question: Which fields identify timestamps and the requested measurement, and how are they bound to the representation?
    example: Inspect bindings for direct CSV, Parquet, Arrow, JSON, RDF and time-grid representations.
    query: |
      PREFIX tss: <https://w3id.org/tss#>
      PREFIX ex: <https://example.org/rdftss-cq/>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT DISTINCT ?source ?profile ?timeField ?timeColumn ?timeIndex
                      ?valueField ?valueColumn ?valueIndex WHERE {
          VALUES ?source { ex:csvSource ex:parquetSource ex:arrowSource ex:jsonSource ex:rdfSource ex:gridSource }
          VALUES ?profile { tss:CSVSource tss:ParquetSource tss:ArrowSource tss:EmbeddedJSONSource tss:EmbeddedRDFSource }
          ?source a ?profile ; tss:timeField ?timeField ; tss:hasField ?valueField .
          ?valueField tss:observedProperty ex:ElectricalConductivity .
          OPTIONAL { ?timeField tss:columnName ?timeColumn }
          OPTIONAL { ?timeField tss:columnIndex ?timeIndex }
          OPTIONAL { ?valueField tss:columnName ?valueColumn }
          OPTIONAL { ?valueField tss:columnIndex ?valueIndex }
      } ORDER BY ?source
    interpretation: For RDF points, field IRIs are the predicates. JSON uses column names as keys. Derived time fields have no column; CQ6 retrieves grid parameters. Unbound values are not automatically errors.
  Interpretation metadata:
  - id: CQ5
    question: What datatype and semantic context describe the selected measurement field?
    example: Retrieve measurement context for the selected CSV conductivity series.
    query: |
      PREFIX tss: <https://w3id.org/tss#>
      PREFIX ex: <https://example.org/rdftss-cq/>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT ?field ?datatype ?property ?unit ?sensor ?feature WHERE {
          VALUES ?source { ex:csvSource }
          ?source tss:hasField ?field .
          ?field tss:observedProperty ?property ; tss:datatype ?datatype .
          VALUES ?property { ex:ElectricalConductivity }
          OPTIONAL { ?field tss:unit ?unit }
          OPTIONAL { ?field tss:sensor ?sensor }
          OPTIONAL { ?field tss:featureOfInterest ?feature }
      } ORDER BY ?field
    interpretation: Reports supplied context, not independently verified domain truth. Missing optional descriptions remain unbound.
  - id: CQ6
    question: What declared parameters are needed to reconstruct timestamps or measurement values from a selected external source?
    example: Compare direct, time-grid and baseline-difference descriptions without decoding their payloads.
    query: |
      PREFIX tss: <https://w3id.org/tss#>
      PREFIX ex: <https://example.org/rdftss-cq/>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT ?source ?dataFile ?field ?timeBase ?timeStep ?stepField ?stepColumn ?stepIndex ?encoding ?baseline WHERE {
          VALUES ?source { ex:csvSource ex:gridSource ex:deltaSource }
          ?source tss:dataFile ?dataFile ; tss:hasField ?field .
          ?field tss:observedProperty ex:ElectricalConductivity .
          OPTIONAL { ?source tss:timeBase ?timeBase }
          OPTIONAL { ?source tss:timeStep ?timeStep }
          OPTIONAL {
              ?source tss:stepField ?stepField .
              OPTIONAL { ?stepField tss:columnName ?stepColumn }
              OPTIONAL { ?stepField tss:columnIndex ?stepIndex }
          }
          OPTIONAL { ?field tss:valueEncoding ?encoding }
          OPTIONAL { ?field tss:baseline ?baseline }
      } ORDER BY ?source
    interpretation: Parameters are optional independently so incomplete declarations remain visible. This is retrieval, not validation. No timestamp or measurement reconstruction is performed.
  Source assessment:
  - id: CQ7
    question: Which selected sources are final, which are still growing, and can a consumer follow them with Range requests?
    example: Compare a final CSV source with a growing Arrow stream that only grows, byte for byte.
    query: |
      PREFIX tss: <https://w3id.org/tss#>
      PREFIX ex: <https://example.org/rdftss-cq/>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT ?source ?profile ?immutable ?rangeRequests WHERE {
          VALUES ?source { ex:csvSource ex:arrowSource }
          VALUES ?profile { tss:CSVSource tss:ParquetSource tss:ArrowSource tss:EmbeddedJSONSource tss:EmbeddedRDFSource }
          ?source a ?profile .
          OPTIONAL { ?source tss:immutable ?declared }
          BIND (COALESCE(?declared, false) AS ?immutable)
          OPTIONAL { ?source tss:rangeRequests ?promised }
          BIND (COALESCE(?promised, false) AS ?rangeRequests)
      } ORDER BY ?source
    interpretation: A source that does not state tss:immutable is growing (the default is false). A growing source that states tss:rangeRequests true promises that its document or data file only grows, byte for byte, so a consumer fetches only the new bytes; otherwise (the default is false) it reads the whole resource again. The metadata does not say when a growing source last changed; a consumer finds that out with HTTP validators (ETag, Last-Modified). The query does not verify publisher behavior.
  - id: CQ8
    question: Which declared summaries are available for selected measurement fields, and what source windows do they describe?
    example: Retrieve available CSV statistics and preserve a Parquet result with no summary.
    query: |
      PREFIX tss: <https://w3id.org/tss#>
      PREFIX ex: <https://example.org/rdftss-cq/>
      PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

      SELECT ?source ?field ?from ?until ?summary ?count ?missing ?minimum ?maximum ?generatedAt WHERE {
          VALUES ?source { ex:csvSource ex:parquetSource }
          ?source tss:hasField ?field .
          ?field tss:observedProperty ex:ElectricalConductivity .
          OPTIONAL { ?source tss:from ?from }
          OPTIONAL { ?source tss:until ?until }
          OPTIONAL {
              ?field tss:summary ?summary .
              OPTIONAL { ?summary tss:count ?count }
              OPTIONAL { ?summary tss:missing ?missing }
              OPTIONAL { ?summary tss:observedMinimum ?minimum }
              OPTIONAL { ?summary tss:observedMaximum ?maximum }
              OPTIONAL { ?summary tss:generatedAtTime ?generatedAt }
          }
      } ORDER BY ?source
    interpretation: Summary numbers are synthetic publisher declarations. They are not recomputed or verified. An absent summary is retained as an unbound result; missing counts do not count absent timestamps.
