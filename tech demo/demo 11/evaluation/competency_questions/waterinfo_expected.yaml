  - [ex:grootdok-source, ex:grootdok-ec20-field, "94853", "125.57", "19035.51"]
  - [ex:rodenhuizedok-source, ex:rodenhuizedok-ec20-field, "158022", "475.51", "19526.76"]
  - [ex:zevenaarshaven-json-source, ex:zevenaarshaven-json-ec20-value-field, "5", "4716.1", "4797.72"]
  - [ex:zevenaarshaven-source, ex:zevenaarshaven-ec20-value-field, "5", "4716.1", "4797.72"]
